name: Publish container

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'c/**'
      - 'docker/Dockerfile.slim'
      - '.dockerignore'
      - '.github/workflows/container.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the slim CPU image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:sha-$GITHUB_SHA" -f docker/Dockerfile.slim .
      - name: Smoke-test the image
        run: |
          docker run --rm "$IMAGE:sha-$GITHUB_SHA" --version
          docker run --rm "$IMAGE:sha-$GITHUB_SHA" --help > /dev/null
          docker run --rm --entrypoint python3 "$IMAGE:sha-$GITHUB_SHA" \
            -c "import openai_server; print('gateway imports')"
          docker run --rm --entrypoint /bin/sh "$IMAGE:sha-$GITHUB_SHA" \
            -c 'test -x /app/colibri'
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish commit image
        run: docker push "$IMAGE:sha-$GITHUB_SHA"
      - name: Publish latest from the default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
