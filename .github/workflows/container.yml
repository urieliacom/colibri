name: CUDA container

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  cuda-container:
    name: Build CUDA 12.4 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: cuda-container-${{ github.event_name == 'push' && 'publish' || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set build-only tag
        run: echo "IMAGE_TAG=ci-cuda-12.4" >> "$GITHUB_ENV"
      - name: Select the next published patch tag
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          owner, package = os.environ["GITHUB_REPOSITORY"].lower().split("/")
          scope = "orgs" if os.environ["OWNER_TYPE"] == "Organization" else "users"
          api = os.environ["GITHUB_API_URL"]
          url = (
              f"{api}/{scope}/{owner}/packages/container/"
              f"{urllib.parse.quote(package, safe='')}/versions"
          )
          # Continue the existing 2.1.0 series; only successfully published tags count.
          patch = 0
          page = 1
          while True:
              request = urllib.request.Request(
                  f"{url}?per_page=100&page={page}",
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      versions = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and page == 1:
                      break  # The package has not been published yet.
                  raise
              for version in versions:
                  for tag in version["metadata"]["container"]["tags"]:
                      match = re.fullmatch(r"2\.1\.(\d+)-cuda-12\.4", tag)
                      if match:
                          patch = max(patch, int(match.group(1)))
              if len(versions) < 100:
                  break
              page += 1
          tag = f"2.1.{patch + 1}-cuda-12.4"
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"IMAGE_TAG={tag}\n")
          print(f"Publishing tag: {tag}")
          PY
      - name: Build the CUDA image
        run: docker build -t "$IMAGE:$IMAGE_TAG" -f docker/Dockerfile.cuda .
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the CUDA image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$IMAGE_TAG"
